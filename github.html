<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GitHub Profile Viewer</title>

    <link rel="stylesheet" href="styles.css">

    <script src="github.js" defer></script>

</head>

<body>

    <main class="container">

        <h1>GitHub Profile Viewer</h1>

        <p class="subtitle">
            Search for a GitHub user and view their profile.
        </p>

        <form id="github-form">

            <label for="username">
                GitHub Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="e.g. torvalds"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>

        <!-- Loading/error messages -->
        <p id="github-status" class="status"></p>

        <!-- Profile will be created using JavaScript -->
        <section id="profile-container"></section>

    </main>

</body>

</html>
